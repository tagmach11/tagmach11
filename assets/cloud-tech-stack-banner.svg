<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff1ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- 배경 하늘 -->
  <rect x="0" y="0" width="900" height="220" rx="16" fill="url(#sky)"/>

  <!-- 뒤쪽 구름 (느리게, 흐릿하게) -->
  <g opacity="0.55" filter="url(#soft)">
    <g>
      <ellipse cx="0" cy="40" rx="55" ry="20" fill="#ffffff"/>
      <ellipse cx="35" cy="30" rx="40" ry="24" fill="#ffffff"/>
      <ellipse cx="-35" cy="32" rx="38" ry="20" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="translate"
        values="-150,0; 1050,0" dur="38s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="170" rx="60" ry="22" fill="#ffffff"/>
      <ellipse cx="40" cy="160" rx="45" ry="26" fill="#ffffff"/>
      <ellipse cx="-40" cy="162" rx="42" ry="22" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="translate"
        values="1050,0; -150,0" dur="46s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 제목 -->
  <text x="450" y="55" text-anchor="middle" font-family="Segoe UI, Pretendard, sans-serif"
        font-size="30" font-weight="700" fill="#2c3e50">☁️ My Tech Stack</text>

  <!-- 기술 스택 뱃지 -->
  <g font-family="Segoe UI, Pretendard, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="70"  y="95" width="130" height="46" rx="23" fill="#f89820"/>
    <text x="135" y="124">Java</text>

    <rect x="215" y="95" width="130" height="46" rx="23" fill="#607d8b"/>
    <text x="280" y="124">JSP</text>

    <rect x="360" y="95" width="130" height="46" rx="23" fill="#4479a1"/>
    <text x="425" y="124">MySQL</text>

    <rect x="505" y="95" width="130" height="46" rx="23" fill="#ff9900"/>
    <text x="570" y="124">AWS</text>

    <rect x="650" y="95" width="150" height="46" rx="23" fill="#2e7d32"/>
    <text x="725" y="124">Security</text>
  </g>

  <!-- 앞쪽 구름 (빠르게, 위쪽만 살짝 스치듯) -->
  <g opacity="0.85">
    <g>
      <ellipse cx="0" cy="15" rx="45" ry="16" fill="#ffffff"/>
      <ellipse cx="28" cy="8" rx="32" ry="18" fill="#ffffff"/>
      <ellipse cx="-28" cy="10" rx="30" ry="16" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="translate"
        values="-120,0; 1020,0" dur="22s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="200" rx="42" ry="15" fill="#ffffff"/>
      <ellipse cx="26" cy="194" rx="30" ry="17" fill="#ffffff"/>
      <ellipse cx="-26" cy="196" rx="28" ry="15" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="translate"
        values="1020,0; -120,0" dur="27s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
